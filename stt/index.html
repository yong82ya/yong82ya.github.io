<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수업 받아쓰기</title>
<style>
:root{--bg:#f4f2fb;--surface:#fff;--ink:#1d1b26;--muted:#6b6878;--line:#e3e0ee;--accent:#5b4bd6;--rec:#d6453d}
@media (prefers-color-scheme:dark){:root{--bg:#16151c;--surface:#201f28;--ink:#ecebf2;--muted:#9a97a8;--line:#33313e;--accent:#9d90ff;--rec:#ff6b62}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:20px;margin:4px 0 2px}p.s{margin:0 0 12px;color:var(--muted);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:46px}
#go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;min-width:150px}
#go.on{background:var(--rec);border-color:var(--rec)}
#st{font-size:14px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
#st i{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
#st.on i{background:var(--rec);animation:b 1s infinite}@keyframes b{50%{opacity:.3}}
#txt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:50vh;white-space:pre-wrap;word-break:keep-all}
#txt .t{color:var(--muted);font-size:12px;margin-right:6px;font-variant-numeric:tabular-nums}
#txt .live{color:var(--muted)}
.warn{background:#fff3cd;color:#664d03;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
</style></head><body>
<main>
<h1>수업 받아쓰기</h1>
<p class="s">시작을 누르고 폰을 책상에 올려 두세요. 화면이 꺼지지 않게 켜 둬야 계속 받아 적어요. 적은 글은 이 폰에 자동 저장돼요.</p>
<div id="warn"></div>
<div id="st"><i></i><span>대기 중</span></div>
<div id="txt"></div>
</main>
<div class="bar">
<button id="go">● 받아쓰기 시작</button>
<button id="copy">복사</button>
<button id="save">파일로 저장</button>
<button id="clear">지우기</button>
</div>
<script>
const $=s=>document.querySelector(s);
const KEY='stt.lines';
let lines=[]; try{ lines=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch{}
let live=''; let on=false; let rec=null; let wake=null; let t0=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const ANDROID=/Android/i.test(navigator.userAgent);
const norm=t=>t.replace(/\s+/g,'');
// a later phrase that repeats or extends the one before replaces it instead of being added again
function addLine(text,at){
  text=text.trim(); if(!text) return;
  const n=norm(text);
  for(let k=lines.length-1;k>=Math.max(0,lines.length-3);k--){
    const p=norm(lines[k].text);
    if(n===p||p.startsWith(n)) return;
    if(n.startsWith(p)){ lines[k].text=text; lines.splice(k+1); return; }
  }
  lines.push({at:at||Date.now(),text});
}
function tidy(old){ lines=[]; for(const l of old) addLine(l.text,l.at); }

if(!SR) $('#warn').innerHTML='<div class="warn">이 브라우저는 받아쓰기를 지원하지 않아요. 갤럭시에서는 <b>크롬</b>으로 열어 주세요.</div>';
const hhmm=d=>{const x=new Date(d);return String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0');};
function store(){ try{ localStorage.setItem(KEY,JSON.stringify(lines)); }catch{} }
function render(){
  const box=$('#txt'); box.replaceChildren();
  let lastMin='';
  for(const l of lines){ const m=hhmm(l.at); if(m!==lastMin){ const t=document.createElement('span'); t.className='t'; t.textContent='\n['+m+'] '; if(!lastMin) t.textContent='['+m+'] '; box.append(t); lastMin=m; } box.append(document.createTextNode(l.text+' ')); }
  if(live){ const s=document.createElement('span'); s.className='live'; s.textContent=live; box.append(s); }
  if(!lines.length&&!live) box.textContent='여기에 받아 적은 글이 나와요.';
  if(on) window.scrollTo(0,document.body.scrollHeight);
}
function status(t){ $('#st span').textContent=t; $('#st').classList.toggle('on',on); $('#go').classList.toggle('on',on); $('#go').textContent=on?'■ 멈추기':'● 받아쓰기 시작'; }
async function keepAwake(){ try{ if('wakeLock' in navigator){ wake=await navigator.wakeLock.request('screen'); } }catch{} }
document.addEventListener('visibilitychange',()=>{ if(on&&document.visibilityState==='visible') keepAwake(); });
function startOnce(){
  rec=new SR(); rec.lang='ko-KR'; rec.continuous=!ANDROID; rec.interimResults=true;
  rec.onresult=e=>{ let inter=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; const tx=r[0].transcript.trim(); if(!tx) continue; if(r.isFinal){ addLine(tx); store(); } else inter+=tx+' '; } live=inter; render(); };
  rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ on=false; status('마이크 권한이 없어요. 주소창 왼쪽 자물쇠에서 마이크를 허용해 주세요.'); } else if(e.error!=='no-speech'&&e.error!=='aborted'){ status('잠깐 끊겼어요, 다시 이어서 받아 적는 중 ('+e.error+')'); } };
  rec.onend=()=>{ if(live){ addLine(live); live=''; store(); render(); } if(on) setTimeout(()=>{ if(on){ try{ startOnce(); }catch{ setTimeout(startOnce,800); } } },ANDROID?60:250); };
  try{ rec.start(); status('받아 적는 중 · '+hhmm(t0)+' 시작'); }catch(e){ status('시작하지 못했어요: '+e.message); }
}
$('#go').onclick=()=>{
  if(!SR) return;
  if(on){ on=false; try{ rec&&rec.stop(); }catch{} try{ wake&&wake.release(); }catch{} status('멈춤 · 총 '+lines.length+'문장'); return; }
  on=true; t0=Date.now(); keepAwake(); startOnce();
};
function plain(){ let out='', last=''; for(const l of lines){ const m=hhmm(l.at); if(m!==last){ out+=(out?'\n':'')+'['+m+'] '; last=m; } out+=l.text+' '; } return out.trim(); }
$('#copy').onclick=async()=>{ try{ await navigator.clipboard.writeText(plain()); status('복사했어요. Claude에 붙여 넣으면 요약해 줘요.'); }catch{ status('복사가 안 돼요. 파일로 저장을 써 주세요.'); } };
$('#save').onclick=()=>{ const d=new Date(); const name=`수업 받아쓰기 ${d.getMonth()+1}-${d.getDate()} ${hhmm(d).replace(':','')}.txt`; const f=new File([plain()],name,{type:'text/plain'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:name}).catch(()=>{}); return; } const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=name; a.click(); };
$('#clear').onclick=()=>{ if(on) return status('먼저 멈춰 주세요'); if(!lines.length) return; if(confirm('받아 적은 글을 모두 지울까요? 먼저 복사나 저장을 해 두세요.')){ lines=[]; store(); render(); status('지웠어요'); } };
tidy(lines.map(l=>({...l}))); store();
render(); status(lines.length?`저장된 글 ${lines.length}문장 · 이어서 시작하면 뒤에 붙어요`:'대기 중');
</script>
</body></html>
